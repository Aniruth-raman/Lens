<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Lens - Document Review</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            appBg: '#111317',
            appSurface: '#1a1c1f',
            appSurfaceContainer: '#1e2023',
            appSurfaceHigh: '#282a2d',
            appBorder: '#333538',
            appBorderLight: '#464554',
            appAccent: '#6366F1',
            appAccentHover: '#5254db',
            appWarning: '#ffb783',
            appWarningContainer: '#352115'
          }
        }
      }
    }
  </script>
<style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #111317;
      color: #e2e2e6;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .aspect-a4 {
      aspect-ratio: 1 / 1.34;
    }
    ::-webkit-scrollbar {
      display: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-appBg text-[#e2e2e6] antialiased selection:bg-appAccent selection:text-white flex justify-center min-h-screen m-0 p-0">
<!-- Mobile Frame (390 x 844 authentic mobile device container) -->
<div class="w-full max-w-[390px] h-[844px] bg-appBg flex flex-col relative overflow-hidden shadow-2xl border-x border-[#1e2023]">
<!-- Status Bar (iOS / Mobile Top Notch Area) -->
<div class="h-11 w-full pt-2 px-6 flex items-center justify-between text-xs select-none shrink-0 z-30 bg-appBg">
<span class="font-semibold tracking-tight text-white text-[14px]">9:41</span>
<div class="flex items-center space-x-2 text-white">
<!-- Cellular Signal -->
<span class="material-symbols-outlined text-[17px] leading-none">signal_cellular_4_bar</span>
<!-- Wifi -->
<span class="material-symbols-outlined text-[17px] leading-none">wifi</span>
<!-- Battery -->
<div class="w-5 h-2.5 border border-white/80 rounded-sm p-0.5 flex items-center ml-0.5">
<div class="h-full w-3 bg-white rounded-2xs"></div>
</div>
</div>
</div>
<!-- App Bar / Navigation Header (44px touch targets) -->
<header class="h-14 px-3 flex items-center justify-between border-b border-appBorder/60 select-none shrink-0 z-30 bg-appBg">
<button aria-label="Go back" class="w-11 h-11 rounded-full flex items-center justify-center text-gray-300 hover:text-white hover:bg-appSurfaceContainer active:bg-appSurfaceHigh transition-colors">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<!-- Editable Document Name Input with subtle pencil -->
<div class="flex-1 mx-1.5 flex items-center bg-appSurfaceContainer/70 hover:bg-appSurfaceContainer focus-within:bg-appSurfaceContainer border border-appBorder/80 rounded-full px-3 py-1.5 transition-all">
<input class="w-full bg-transparent text-[13px] font-medium text-white tracking-tight border-none p-0 focus:outline-none focus:ring-0 truncate" id="doc-name-input" type="text" value="Scan 2026-10-14"/>
<span class="material-symbols-outlined text-[15px] text-gray-400 ml-1.5 shrink-0 select-none">edit</span>
</div>
<!-- Page Counter Badge -->
<div class="pl-1">
<span class="text-[12px] font-mono font-medium text-gray-300 bg-appSurfaceContainer px-2.5 py-1 rounded-full border border-appBorder" id="page-counter-badge">
          4 / 10
        </span>
</div>
</header>
<!-- State Switcher Bar (Google Minimal segmented control) -->
<div class="px-4 py-2 shrink-0 z-20 bg-appBg border-b border-appBorder/40">
<div class="bg-appSurfaceContainer p-1 rounded-xl flex items-center justify-between text-xs border border-appBorder/60">
<button class="flex-1 py-1 px-2 rounded-lg font-medium text-[12px] text-center bg-appSurfaceHigh text-white shadow-xs border border-white/5 transition-all" id="btn-tab-standard" onclick="setReviewMode('standard')">Review (4)</button>
<button class="flex-1 py-1 px-2 rounded-lg font-medium text-[12px] text-center text-gray-400 hover:text-white transition-all" id="btn-tab-limit" onclick="setReviewMode('limit')">Limit (10)</button>
<button class="flex-1 py-1 px-2 rounded-lg font-medium text-[12px] text-center text-gray-400 hover:text-white transition-all" id="btn-tab-exporting" onclick="setReviewMode('exporting')">Exporting</button>
</div>
</div>
<!-- Limit Banner (Google Material 3 subtle alert) -->
<div class="hidden px-4 py-2.5 bg-appWarningContainer/80 border-b border-amber-900/50 flex items-center space-x-2.5 shrink-0 transition-all" id="limit-banner">
<span class="material-symbols-outlined text-amber-300 text-[18px] shrink-0 fill">warning</span>
<p class="text-[12px] text-amber-100 font-medium leading-snug">
        10 page limit reached. Export or delete pages to continue.
      </p>
</div>
<!-- Vertically Scrolling Reel Container -->
<main class="flex-1 overflow-y-auto px-5 py-4 space-y-4 pb-36" id="reel-container">
<!-- Page 1 Card -->
<div class="page-card group relative bg-white text-gray-900 rounded-2xl shadow-xl border border-gray-200 overflow-hidden aspect-a4 p-5 flex flex-col justify-between select-none transition-transform">
<!-- Page Number Badge (top-left) -->
<div class="absolute top-3 left-3 z-10 bg-black/85 backdrop-blur-md text-[11px] font-mono font-medium text-white px-2.5 py-0.5 rounded-full shadow-sm flex items-center space-x-1">
<span>Page 1</span>
</div>
<!-- Remove Page Button (top-right, >=44px touch target) -->
<button aria-label="Remove page 1" class="absolute top-1 right-1 z-10 w-11 h-11 flex items-center justify-center text-gray-400 hover:text-white transition-transform active:scale-95" onclick="this.closest('.page-card').remove(); updatePageCount(-1);">
<span class="w-7 h-7 rounded-full bg-black/80 hover:bg-black text-white flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[16px]">close</span>
</span>
</button>
<!-- Simulated Document Content -->
<div class="pt-6 space-y-3">
<div class="flex items-center justify-between border-b border-gray-200 pb-2">
<div class="h-4 w-32 bg-gray-900 rounded-sm"></div>
<div class="h-3 w-16 bg-gray-300 rounded-xs"></div>
</div>
<div class="space-y-1.5 pt-1">
<div class="h-2 w-full bg-gray-300 rounded-xs"></div>
<div class="h-2 w-11/12 bg-gray-200 rounded-xs"></div>
<div class="h-2 w-4/5 bg-gray-200 rounded-xs"></div>
<div class="h-2 w-full bg-gray-200 rounded-xs"></div>
</div>
<div class="grid grid-cols-2 gap-2 pt-2">
<div class="h-10 bg-gray-50 border border-gray-200 rounded-md p-1.5 space-y-1">
<div class="h-1.5 w-12 bg-gray-400 rounded-xs"></div>
<div class="h-2 w-20 bg-gray-800 rounded-xs"></div>
</div>
<div class="h-10 bg-gray-50 border border-gray-200 rounded-md p-1.5 space-y-1">
<div class="h-1.5 w-10 bg-gray-400 rounded-xs"></div>
<div class="h-2 w-16 bg-indigo-600 rounded-xs"></div>
</div>
</div>
</div>
<div class="space-y-2 pt-2 border-t border-gray-100 flex items-end justify-between">
<div class="space-y-1">
<div class="h-1.5 w-24 bg-gray-300 rounded-xs"></div>
<div class="h-1.5 w-16 bg-gray-200 rounded-xs"></div>
</div>
<div class="h-6 w-20 bg-gray-900/10 rounded flex items-center justify-center text-[9px] font-mono text-gray-500">
            CONFIDENTIAL
          </div>
</div>
</div>
<!-- Page 2 Card -->
<div class="page-card group relative bg-[#fcfcfd] text-gray-900 rounded-2xl shadow-xl border border-gray-200 overflow-hidden aspect-a4 p-5 flex flex-col justify-between select-none transition-transform">
<!-- Page Number Badge -->
<div class="absolute top-3 left-3 z-10 bg-black/85 backdrop-blur-md text-[11px] font-mono font-medium text-white px-2.5 py-0.5 rounded-full shadow-sm flex items-center space-x-1">
<span>Page 2</span>
</div>
<!-- Remove Page Button -->
<button aria-label="Remove page 2" class="absolute top-1 right-1 z-10 w-11 h-11 flex items-center justify-center text-gray-400 hover:text-white transition-transform active:scale-95" onclick="this.closest('.page-card').remove(); updatePageCount(-1);">
<span class="w-7 h-7 rounded-full bg-black/80 hover:bg-black text-white flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[16px]">close</span>
</span>
</button>
<!-- Simulated Document Content -->
<div class="pt-6 space-y-3">
<div class="h-3.5 w-28 bg-gray-800 rounded-sm"></div>
<div class="space-y-1.5">
<div class="h-2 w-full bg-gray-200 rounded-xs"></div>
<div class="h-2 w-10/12 bg-gray-200 rounded-xs"></div>
<div class="h-2 w-5/6 bg-gray-200 rounded-xs"></div>
</div>
<!-- Verified Stamp Box -->
<div class="border border-dashed border-indigo-400/70 bg-indigo-50/50 rounded-xl p-3 flex flex-col items-center justify-center space-y-1 my-2">
<span class="material-symbols-outlined text-indigo-600 text-[20px]">verified</span>
<span class="text-[10px] font-mono tracking-wider font-semibold text-indigo-700">OFFICIALLY VERIFIED</span>
<span class="text-[8px] font-mono text-gray-400">ID: #99402-A</span>
</div>
</div>
<div class="flex items-center justify-between pt-2 border-t border-gray-100">
<div class="h-2 w-28 bg-gray-300 rounded-xs"></div>
<div class="h-2 w-12 bg-gray-200 rounded-xs"></div>
</div>
</div>
<!-- Page 3 Card -->
<div class="page-card group relative bg-white text-gray-900 rounded-2xl shadow-xl border border-gray-200 overflow-hidden aspect-a4 p-5 flex flex-col justify-between select-none transition-transform">
<!-- Page Number Badge -->
<div class="absolute top-3 left-3 z-10 bg-black/85 backdrop-blur-md text-[11px] font-mono font-medium text-white px-2.5 py-0.5 rounded-full shadow-sm flex items-center space-x-1">
<span>Page 3</span>
</div>
<!-- Remove Page Button -->
<button aria-label="Remove page 3" class="absolute top-1 right-1 z-10 w-11 h-11 flex items-center justify-center text-gray-400 hover:text-white transition-transform active:scale-95" onclick="this.closest('.page-card').remove(); updatePageCount(-1);">
<span class="w-7 h-7 rounded-full bg-black/80 hover:bg-black text-white flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[16px]">close</span>
</span>
</button>
<!-- Simulated Document Content -->
<div class="pt-6 space-y-3">
<div class="h-3.5 w-36 bg-gray-800 rounded-sm"></div>
<div class="space-y-1.5">
<div class="h-2 w-full bg-gray-200 rounded-xs"></div>
<div class="h-2 w-full bg-gray-200 rounded-xs"></div>
<div class="h-2 w-3/4 bg-gray-200 rounded-xs"></div>
</div>
<div class="h-16 w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 flex flex-col justify-between">
<div class="h-2 w-20 bg-gray-400 rounded-xs"></div>
<div class="h-2 w-full bg-gray-200 rounded-xs"></div>
<div class="h-2 w-1/2 bg-gray-300 rounded-xs"></div>
</div>
</div>
<div class="flex items-center justify-between pt-2 border-t border-gray-100">
<div class="h-2 w-20 bg-gray-300 rounded-xs"></div>
<div class="h-4 w-16 bg-gray-100 rounded-sm border border-gray-200"></div>
</div>
</div>
</main>
<!-- Fixed Bottom Action Bar with Mobile Safe Area Padding -->
<div class="absolute bottom-0 left-0 right-0 bg-[#111317]/95 backdrop-blur-lg border-t border-appBorder/80 px-5 pt-3 pb-6 space-y-2.5 z-40">
<!-- Export Progress Indicator (Exporting State) -->
<div class="hidden space-y-1.5 pb-1" id="export-progress-container">
<div class="flex items-center justify-between text-xs">
<div class="flex items-center space-x-1.5">
<span class="w-2 h-2 rounded-full bg-appAccent animate-ping"></span>
<span class="text-gray-200 font-medium">Exporting document...</span>
</div>
<span class="text-appAccent font-mono font-medium text-xs">75%</span>
</div>
<div class="w-full h-1.5 bg-appSurfaceContainer rounded-full overflow-hidden border border-appBorder">
<div class="h-full bg-appAccent rounded-full w-3/4 transition-all duration-300"></div>
</div>
</div>
<!-- Primary Action: Export as PDF -->
<button class="w-full h-12 rounded-full bg-appAccent hover:bg-appAccentHover text-white font-medium text-[14px] flex items-center justify-center space-x-2 active:scale-[0.99] transition-all shadow-lg shadow-appAccent/25" id="btn-export-pdf">
<span class="material-symbols-outlined text-[19px]">picture_as_pdf</span>
<span>Export as PDF</span>
</button>
<!-- Secondary Action: Save as Images -->
<button class="w-full h-12 rounded-full bg-[#161920] hover:bg-appSurfaceHigh text-gray-200 border border-[#2D333F] font-medium text-[14px] flex items-center justify-center space-x-2 active:scale-[0.99] transition-all" id="btn-save-images">
<span class="material-symbols-outlined text-[19px] text-gray-400">photo_library</span>
<span>Save as Images</span>
</button>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-white/20 rounded-full mx-auto pt-0.5"></div>
</div>
</div>
<script>
    let currentCount = 4;

    function updatePageCount(delta) {
      currentCount = Math.max(1, currentCount + delta);
      document.getElementById('page-counter-badge').innerText = `${currentCount} / 10`;
    }

    function setReviewMode(mode) {
      const banner = document.getElementById('limit-banner');
      const counter = document.getElementById('page-counter-badge');
      const progress = document.getElementById('export-progress-container');
      const btnPdf = document.getElementById('btn-export-pdf');
      const btnImages = document.getElementById('btn-save-images');

      const tabStandard = document.getElementById('btn-tab-standard');
      const tabLimit = document.getElementById('btn-tab-limit');
      const tabExporting = document.getElementById('btn-tab-exporting');

      // Reset tabs styling
      const inactiveTabClass = "flex-1 py-1 px-2 rounded-lg font-medium text-[12px] text-center text-gray-400 hover:text-white transition-all";
      const activeTabClass = "flex-1 py-1 px-2 rounded-lg font-medium text-[12px] text-center bg-appSurfaceHigh text-white shadow-xs border border-white/5 transition-all";

      tabStandard.className = inactiveTabClass;
      tabLimit.className = inactiveTabClass;
      tabExporting.className = inactiveTabClass;

      if (mode === 'standard') {
        tabStandard.className = activeTabClass;
        banner.classList.add('hidden');
        progress.classList.add('hidden');
        counter.innerText = `${currentCount} / 10`;
        btnPdf.disabled = false;
        btnPdf.className = "w-full h-12 rounded-full bg-appAccent hover:bg-appAccentHover text-white font-medium text-[14px] flex items-center justify-center space-x-2 active:scale-[0.99] transition-all shadow-lg shadow-appAccent/25";
        btnImages.disabled = false;
        btnImages.className = "w-full h-12 rounded-full bg-[#161920] hover:bg-appSurfaceHigh text-gray-200 border border-[#2D333F] font-medium text-[14px] flex items-center justify-center space-x-2 active:scale-[0.99] transition-all";
      } else if (mode === 'limit') {
        tabLimit.className = activeTabClass;
        banner.classList.remove('hidden');
        progress.classList.add('hidden');
        counter.innerText = "10 / 10";
        btnPdf.disabled = false;
        btnPdf.className = "w-full h-12 rounded-full bg-appAccent hover:bg-appAccentHover text-white font-medium text-[14px] flex items-center justify-center space-x-2 active:scale-[0.99] transition-all shadow-lg shadow-appAccent/25";
        btnImages.disabled = false;
        btnImages.className = "w-full h-12 rounded-full bg-[#161920] hover:bg-appSurfaceHigh text-gray-200 border border-[#2D333F] font-medium text-[14px] flex items-center justify-center space-x-2 active:scale-[0.99] transition-all";
      } else if (mode === 'exporting') {
        tabExporting.className = activeTabClass;
        banner.classList.add('hidden');
        progress.classList.remove('hidden');
        counter.innerText = `${currentCount} / 10`;
        btnPdf.disabled = true;
        btnPdf.className = "w-full h-12 rounded-full bg-appAccent/40 text-white/50 font-medium text-[14px] flex items-center justify-center space-x-2 cursor-not-allowed";
        btnImages.disabled = true;
        btnImages.className = "w-full h-12 rounded-full bg-[#161920]/40 text-gray-500 border border-[#2D333F]/40 font-medium text-[14px] flex items-center justify-center space-x-2 cursor-not-allowed";
      }
    }
  </script>
</body></html>
